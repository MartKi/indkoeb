<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Indkøb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Indkøb</title>
<style>
  :root { --bg:#f6f7f4; --card:#fff; --ink:#1d2a22; --muted:#6b7a70; --accent:#2f7d4f; --line:#e3e8e2; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111613; --card:#1a211d; --ink:#e8efe9; --muted:#8fa096; --accent:#4fae77; --line:#26302a; --err:#f97066; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding-bottom:90px; }
  header { position:sticky; top:0; background:var(--bg); padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; border-bottom:1px solid var(--line); z-index:5; }
  .row { display:flex; gap:8px; align-items:center; }
  h1 { font-size:18px; margin:0; flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
  .storeWrap { display:flex; flex-direction:column; min-width:0; max-width:100%; border:1px solid var(--line); border-radius:10px; background:var(--card); padding:3px 10px 4px; }
  .storeLbl { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); line-height:1.2; }
  select.store { font:inherit; font-size:16px; font-weight:700; color:var(--ink); background:transparent; border:0; padding:0; margin:0; max-width:100%; min-width:0; text-overflow:ellipsis; }
  dialog h3:focus { outline:none; }
  .badge { font-size:12px; color:var(--muted); white-space:nowrap; }
  .badge.demo { color:#b45309; }
  .badge.error { color:var(--err); }
  .banner { display:none; margin-top:8px; padding:8px 10px; border-radius:8px; border:1px solid var(--err); color:var(--err); font-size:13px; }
  .banner.show { display:block; }
  form { display:flex; gap:8px; margin-top:10px; }
  input[type=text] { flex:1; font-size:16px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%; }
  button { font:inherit; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); padding:8px 10px; border:1px solid var(--line); font-size:14px; }
  main { padding:6px 14px; max-width:640px; margin:0 auto; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 6px; }
  .item { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:6px; }
  .item input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); flex:none; }
  .item .name { flex:1; min-width:0; word-break:break-word; cursor:pointer; }
  .item .note { display:block; font-size:13px; color:var(--muted); margin-top:1px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .item .note::before { content:"💬"; margin-right:4px; font-size:12px; } /* ren pynt, ikke en del af noten */
  textarea { font:inherit; font-size:16px; width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); resize:vertical; }
  .item.done .name { text-decoration:line-through; color:var(--muted); }
  /* Kategori: lille ikon, den rigtige select ligger usynligt ovenpå, så telefonens egen vælger åbner */
  .catWrap { position:relative; flex:none; width:34px; height:34px; display:grid; place-items:center; border:1px solid var(--line); border-radius:8px; font-size:15px; opacity:.75; }
  .item.done .catWrap { opacity:.4; }
  .catWrap select { position:absolute; inset:0; width:100%; height:100%; opacity:0; font-size:16px; cursor:pointer; }
  .del { background:transparent; color:var(--muted); padding:4px 8px; font-size:18px; }
  .who { flex:none; width:24px; height:24px; border-radius:50%; font-size:12px; font-weight:700; color:#fff; display:grid; place-items:center; }
  .item.done .who { opacity:.5; }
  .clearBar { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:18px 0 0; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 16px); z-index:20; display:none; align-items:center; gap:12px; width:max-content; max-width:calc(100% - 28px); white-space:nowrap; background:var(--ink); color:var(--bg); border-radius:12px; padding:10px 10px 10px 16px; box-shadow:0 6px 20px rgba(0,0,0,.25); font-size:15px; }
  .toast.show { display:flex; }
  .toast button { background:transparent; color:#86efac; border:1px solid currentColor; padding:6px 12px; font-weight:700; }
  @media (prefers-color-scheme: dark) { .toast button { color:#2f7d4f; } }
  button.danger { color:var(--err); border-color:var(--err); }
  .suggest { display:flex; gap:6px; overflow-x:auto; margin-top:8px; padding-bottom:2px; scrollbar-width:none; }
  .suggest::-webkit-scrollbar { display:none; }
  .suggest:empty { display:none; }
  .suggest .lbl { flex:none; align-self:center; font-size:12px; color:var(--muted); }
  .chip { flex:none; font-size:15px; padding:7px 12px; border-radius:999px; background:var(--card); color:var(--ink); border:1px solid var(--line); white-space:nowrap; }
  .chip small { color:var(--muted); font-size:11px; margin-left:4px; }
  .chip:first-of-type { border-color:var(--accent); }
  .empty { text-align:center; color:var(--muted); margin-top:60px; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); max-width:420px; width:calc(100% - 28px); max-height:calc(100% - 40px); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .order li { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); list-style:none; }
  .order { padding:0; margin:10px 0; }
  .order span { flex:1; }
  .order button { padding:4px 10px; background:transparent; color:var(--ink); border:1px solid var(--line); }
  label { display:block; font-size:13px; color:var(--muted); margin-top:12px; }
  .hint { font-size:12px; color:var(--muted); margin:4px 0 0; }
  .storeBtns { flex-wrap:wrap; margin-top:6px; }
</style>
</head>
<body>

<header>
  <div class="row">
    <h1><span aria-hidden="true">🛒</span><span class="storeWrap"><span class="storeLbl" aria-hidden="true">Butik</span><select id="store" class="store" aria-label="Vælg butik"></select></span></h1>
    <span id="mode" class="badge"></span>
    <button class="ghost" id="settingsBtn">Indstillinger</button>
  </div>
  <form id="addForm" autocomplete="off">
    <input type="text" id="newItem" placeholder="Fx agurk eller yoghurt: jordbær" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="suggest">
    <button type="submit">Tilføj</button>
  </form>
  <div id="suggest" class="suggest" aria-label="Forslag"></div>
  <div id="banner" class="banner" role="alert"></div>
</header>

<main id="list"></main>
<div id="toast" class="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="undoBtn" type="button">Fortryd</button></div>

<dialog id="editItem">
  <h3 style="margin-top:0" tabindex="-1" autofocus>Ret vare</h3>
  <label for="editName">Vare</label>
  <input type="text" id="editName" maxlength="80" autocapitalize="off">
  <label for="editNote">Note (valgfri)</label>
  <textarea id="editNote" rows="2" maxlength="200" placeholder="fx køb den billigste"></textarea>
  <p class="hint">Genvej når du skriver varen på: yoghurt: jordbær, ellers blåbær</p>
  <div class="row" style="margin-top:14px">
    <button class="ghost" id="editCancel" type="button">Annuller</button>
    <span style="flex:1"></span>
    <button id="editSave" type="button">Gem</button>
  </div>
</dialog>

<dialog id="settings">
  <h3 style="margin-top:0" tabindex="-1" autofocus>Indstillinger</h3>
  <label for="code">Listekode (min. 8 tegn, del den med din kone)</label>
  <input type="text" id="code" autocapitalize="off" autocorrect="off" spellcheck="false">
  <p class="hint">Eller del hele linket. Koden står efter # i adresselinjen.</p>

  <label for="myName">Dit navn (vises ved de varer, du skriver på)</label>
  <input type="text" id="myName" maxlength="20" placeholder="fx Martin">
  <p class="hint">Gælder kun denne telefon.</p>

  <label>Butik</label>
  <div class="row storeBtns">
    <strong id="storeName" style="flex:1"></strong>
    <button class="ghost" id="newStore">Ny</button>
    <button class="ghost" id="renameStore">Omdøb</button>
    <button class="ghost" id="deleteStore">Slet</button>
  </div>
  <p class="hint">Butikker og rækkefølge deles med alle på listen. Valget af butik gælder kun denne telefon.</p>

  <label>Rækkefølge i butikken (øverst = først)</label>
  <ul class="order" id="order"></ul>
  <div class="row" style="margin-top:14px">
    <button class="ghost danger" id="clearAll">Tøm hele listen</button>
    <span style="flex:1"></span>
    <button id="closeSettings">Gem og luk</button>
  </div>
</dialog>

const KEYWORDS = {

  "Frost": ["frost","is ","vaniljeis","pizza","pommes","grøntsagsblanding","frosne","fiskestave","frossen","bagt kartoffel"],

// ============================================================
// 3) HJÆLPERE + LOKAL LAGRING
// ============================================================
const $ = (s) => document.querySelector(s);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// crypto.getRandomValues virker også uden HTTPS (fx test på lokalnet), det gør randomUUID ikke
function randomCode(len = 9) {
  const a = new Uint8Array(len); crypto.getRandomValues(a);
  return [...a].map(b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
}

function validCode(c) { return typeof c === "string" && c.length >= MIN_CODE && !c.includes("/"); }

let listCode = decodeURIComponent(location.hash.slice(1));
if (!validCode(listCode)) listCode = ls.get("listCode") || "";
if (!validCode(listCode)) listCode = randomCode();
ls.set("listCode", listCode);
history.replaceState(null, "", "#" + encodeURIComponent(listCode));
window.addEventListener("hashchange", () => location.reload());

let myName = ls.get("myName", "");             // hvem der skriver varer på (kun denne enhed)
let history_ = ls.get("history", []);   // tidligere varer til autocomplete (kun denne enhed)

// Delt opsætning (butiksprofiler + lærte rettelser), synkroniseres via backend
let meta = { profiles: {}, overrides: {}, freq: {} };
let metaLoaded = false;
let activeId = ls.get("activeProfile", null); // valgt butik gælder kun denne enhed

function profileList() {
  return Object.entries(meta.profiles || {})
    .map(([id, p]) => ({ id, ...p }))
    .sort((a, b) => (a.created || 0) - (b.created || 0) || (a.name || "").localeCompare(b.name || "", "da"));
}
function activeProfile() {
  const ps = profileList();
  return ps.find(p => p.id === activeId) || ps[0] || { id: "standard", name: "Standard", order: ls.get("order", DEFAULT_ORDER) };
}
function currentOrder() {
  const o = (activeProfile().order || []).filter(c => DEFAULT_ORDER.includes(c));
  for (const c of DEFAULT_ORDER) if (!o.includes(c)) o.push(c);
  return o;
}
// Farve: grøn = skrevet på fra denne telefons navn, orange = en anden
function whoColor(name) { return myName && name.toLowerCase() === myName.toLowerCase() ? "#2f7d4f" : "#c2410c"; }
function askName() {
  if (myName) return myName;
  const n = (prompt("Hvad hedder du? Navnet vises ved de varer, du skriver på listen.") || "").trim().slice(0, 20);
  if (n) { myName = n; ls.set("myName", n); }
  return myName;
}
function normName(name) { return name.toLowerCase().trim(); }

function categorize(name) {
  const n = normName(name);
  const ov = (meta.overrides || {})[n];
  if (ov && DEFAULT_ORDER.includes(ov)) return ov;
  let best = null, bestLen = 0;
  const tokens = n.split(/[^a-zæøå0-9]+/).filter(Boolean);
  for (const [cat, words] of Object.entries(KEYWORDS)) {
    for (const raw of words) {
      const w = raw.trim();
      // korte nøgleord (<=3 tegn) skal matche et helt ord, så "te" ikke rammer "mynte"
      const hit = w.length <= 3 ? tokens.includes(w) : n.includes(w);
      if (hit && w.length > bestLen) { best = cat; bestLen = w.length; }
    }
  }
  // TODO (fase 2): hvis best === null, kald et AI-endpoint og gem svaret i overrides
  return best || "Andet";
}

// ============================================================
// 4) FEJLVISNING
// ============================================================
function showError(e) {
  console.error(e);
  const code = (e && e.code) || "";
  let msg = "Noget gik galt: " + ((e && e.message) || e);
  if (code === "permission-denied") {
    msg = "Firestore afviste adgangen. Tjek at reglerne er udgivet (se README), og at listekoden har mindst " + MIN_CODE + " tegn.";
  } else if (code === "failed-precondition" || code === "not-found") {
    msg = "Firestore-databasen findes ikke eller er ikke klar. Opret den i Firebase Console (Firestore > Create database).";
  } else if (code === "unavailable") {
    msg = "Ingen forbindelse til serveren. Ændringer gemmes lokalt og sendes, når du er online igen.";
  }
  $("#banner").textContent = msg;
  $("#banner").classList.add("show");
  $("#mode").textContent = code === "unavailable" ? "Offline" : "Fejl";
  $("#mode").classList.toggle("error", code !== "unavailable");
}
function clearError() { $("#banner").classList.remove("show"); $("#mode").classList.remove("error"); }
const run = (p) => Promise.resolve(p).catch(showError);

// ============================================================
// 5) BACKEND: Firestore eller demo (localStorage)
//    Data: lists/{kode}/items/{id} og lists/{kode}/meta/config
// ============================================================
const demo = firebaseConfig.apiKey === "DIN_API_KEY";
let backend;

function deepMerge(target, patch) {
  for (const [k, v] of Object.entries(patch)) {
    if (v === DELETE) delete target[k];
    else if (v && typeof v === "object" && !Array.isArray(v)) target[k] = deepMerge(target[k] && typeof target[k] === "object" ? target[k] : {}, v);
    else target[k] = v;
  }
  return target;
}
const DELETE = Symbol("delete");

if (demo) {
  const key = "demo-items-" + listCode, mkey = "demo-meta-" + listCode;
  const load = () => ls.get(key, []);
  const save = (v) => ls.set(key, v);
  const subs = new Set(), msubs = new Set();
  const emit = () => subs.forEach(cb => cb(load()));
  const memit = () => msubs.forEach(cb => cb(ls.get(mkey, {}), false));
  const mpatch = (p) => { ls.set(mkey, deepMerge(ls.get(mkey, {}), p)); memit(); };
  window.addEventListener("storage", (e) => { if (e.key === key) emit(); if (e.key === mkey) memit(); });
  backend = {
    subscribe(cb) { subs.add(cb); cb(load()); },
    subscribeMeta(cb) { msubs.add(cb); cb(ls.get(mkey, {}), false); },
    async add(it) { save([...load(), { id: randomCode(16), ...it }]); emit(); },
    async update(id, patch) { save(load().map(x => x.id === id ? { ...x, ...patch } : x)); emit(); },
    async remove(id) { save(load().filter(x => x.id !== id)); emit(); },
    async removeMany(ids) { save(load().filter(x => !ids.includes(x.id))); emit(); },
    async restore(list) { const have = new Set(load().map(x => x.id)); save([...load(), ...list.filter(x => !have.has(x.id))]); emit(); },
    async setOverride(name, cat) { mpatch({ overrides: { [name]: cat } }); },
    async saveProfile(id, p) { mpatch({ profiles: { [id]: p } }); },
    async deleteProfile(id) { mpatch({ profiles: { [id]: DELETE } }); },
    async bumpFreq(names) { const f = ls.get(mkey, {}).freq || {}; mpatch({ freq: Object.fromEntries(names.map(n => [n, (f[n] || 0) + 1])) }); }
  };
  $("#mode").textContent = "Demo (lokal)";
  $("#mode").classList.add("demo");
} else {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    const fs = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    const db = fs.initializeFirestore(app, {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });
    const col = fs.collection(db, "lists", listCode, "items");
    const metaRef = fs.doc(db, "lists", listCode, "meta", "config");
    const mset = (p) => fs.setDoc(metaRef, p, { merge: true });
    backend = {
      subscribe(cb) {
        fs.onSnapshot(col, { includeMetadataChanges: true }, (snap) => {
          cb(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          if (!$("#mode").classList.contains("error")) {
            $("#mode").textContent = snap.metadata.fromCache ? "Offline-cache" : (snap.metadata.hasPendingWrites ? "Gemmer…" : "Live");
          }
          if (!snap.metadata.fromCache) clearError();
        }, showError);
      },
      subscribeMeta(cb) {
        fs.onSnapshot(metaRef, { includeMetadataChanges: true }, (snap) => cb(snap.data() || {}, snap.metadata.fromCache), showError);
      },
      add(it) { return fs.addDoc(col, { ...it, createdAt: fs.serverTimestamp() }); },
      update(id, patch) { return fs.updateDoc(fs.doc(col, id), patch); },
      remove(id) { return fs.deleteDoc(fs.doc(col, id)); },
      async removeMany(ids) { const b = fs.writeBatch(db); ids.forEach(i => b.delete(fs.doc(col, i))); return b.commit(); },
      async restore(list) { const b = fs.writeBatch(db); list.forEach(({ id, ...data }) => b.set(fs.doc(col, id), data)); return b.commit(); },
      setOverride(name, cat) { return mset({ overrides: { [name]: cat } }); },
      saveProfile(id, p) { return mset({ profiles: { [id]: p } }); },
      deleteProfile(id) { return mset({ profiles: { [id]: fs.deleteField() } }); },
      bumpFreq(names) { return mset({ freq: Object.fromEntries(names.map(n => [n, fs.increment(1)])) }); }
    };
    $("#mode").textContent = "Forbinder…";
  } catch (e) {
    showError(e);
    throw e;
  }
}

// ============================================================
// 6) UI
// ============================================================
let items = [];

function render() {
  const root = $("#list");
  root.innerHTML = "";
  const order = currentOrder();
  const open = items.filter(i => !i.checked);
  const done = items.filter(i => i.checked);

  if (!items.length) {
    root.innerHTML = '<div class="empty">Listen er tom.<br>Tilføj din første vare ovenfor.</div>';
  }

  for (const cat of order) {
    const group = open.filter(i => (DEFAULT_ORDER.includes(i.category) ? i.category : "Andet") === cat)
      .sort((a, b) => a.name.localeCompare(b.name, "da"));
    if (!group.length) continue;
    const h = document.createElement("h2"); h.textContent = cat; root.appendChild(h);
    group.forEach(i => root.appendChild(rowFor(i, order)));
  }

  if (done.length) {
    const h = document.createElement("h2"); h.textContent = "Købt (" + done.length + ")"; root.appendChild(h);
    done.forEach(i => root.appendChild(rowFor(i, order)));
  }

  if (items.length) {
    const bar = document.createElement("div"); bar.className = "clearBar";
    if (done.length) {
      const btn = document.createElement("button"); btn.className = "ghost";
      btn.textContent = "Ryd købte (" + done.length + ")";
      btn.onclick = () => removeWithUndo(done, done.length === 1 ? "1 købt vare ryddet" : done.length + " købte varer ryddet");
      bar.appendChild(btn);
    }
    const all = document.createElement("button"); all.className = "ghost danger";
    all.textContent = "Tøm listen (" + items.length + ")";
    all.onclick = clearAll;
    bar.appendChild(all);
    root.appendChild(bar);
  }

  renderSuggest();
}

function renderStores() {
  const sel = $("#store"); sel.innerHTML = "";
  const ap = activeProfile();
  const ps = profileList();
  (ps.length ? ps : [ap]).forEach(p => sel.add(new Option(p.name || "Uden navn", p.id, false, p.id === ap.id)));
  $("#storeName").textContent = ap.name || "Uden navn";
  $("#deleteStore").disabled = ps.length <= 1;
}

function rowFor(i, order) {
  const el = document.createElement("div");
  el.className = "item" + (i.checked ? " done" : "");
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = !!i.checked;
  cb.onchange = () => run(backend.update(i.id, { checked: cb.checked }));
  const name = document.createElement("span"); name.className = "name";
  name.append(i.name);
  if (i.note) { const nt = document.createElement("span"); nt.className = "note"; nt.textContent = i.note; name.appendChild(nt); }
  name.setAttribute("role", "button"); name.tabIndex = 0;
  name.setAttribute("aria-label", "Ret " + i.name + (i.note ? ", note: " + i.note : ""));
  name.onclick = () => openEdit(i);
  name.onkeydown = (e) => { if (e.key === "Enter") openEdit(i); };
  const catWrap = document.createElement("span"); catWrap.className = "catWrap";
  const catIcon = document.createElement("span"); catIcon.textContent = "🏷️"; catIcon.setAttribute("aria-hidden", "true");
  const sel = document.createElement("select"); sel.className = "tag";
  catWrap.title = "Kategori: " + (i.category || "Andet");
  catWrap.append(catIcon, sel);
  sel.setAttribute("aria-label", "Kategori for " + i.name);
  order.forEach(c => sel.add(new Option(c, c, false, c === i.category)));
  sel.onchange = () => {
    run(backend.setOverride(normName(i.name), sel.value));
    run(backend.update(i.id, { category: sel.value }));
  };
  const del = document.createElement("button"); del.className = "del"; del.textContent = "×";
  del.setAttribute("aria-label", "Slet " + i.name);
  del.onclick = () => run(backend.remove(i.id));
  const parts = [cb];
  if (i.by) {
    const who = document.createElement("span"); who.className = "who";
    who.textContent = i.by.charAt(0).toUpperCase();
    who.style.background = whoColor(i.by);
    who.title = "Skrevet på af " + i.by;
    who.setAttribute("aria-label", "Skrevet på af " + i.by);
    parts.push(who);
  }
  el.append(...parts, name, catWrap, del);
  return el;
}

$("#addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const raw = $("#newItem").value.trim();
  if (!raw) return;
  // Flere varer adskilt af komma: "mælk, æg, agurk".
  // Alt efter første kolon er note til varen lige før: "mælk, yoghurt: jordbær, ellers blåbær"
  const colon = raw.indexOf(":");
  if (colon >= 0) {
    const names = raw.slice(0, colon).split(",");
    addItems(names, raw.slice(colon + 1).trim());
  } else {
    addItems(raw.split(","));
  }
  $("#newItem").value = "";
  $("#newItem").focus();
  renderSuggest();
});

function addItems(names, lastNote = "") {
  names = names.map(s => s.trim()).filter(Boolean);
  if (!names.length) return;
  const by = askName();
  names.forEach((name, idx) => {
    const note = idx === names.length - 1 ? lastNote.slice(0, 200) : "";
    run(backend.add({ name, category: categorize(name), checked: false, ...(by ? { by } : {}), ...(note ? { note } : {}) }));
    const n = normName(name);
    if (!history_.includes(n)) history_.push(n);
  });
  ls.set("history", history_.slice(-500));
  run(backend.bumpFreq([...new Set(names.map(normName))]));
}

// ============================================================
// FORSLAG MENS MAN SKRIVER
// Kilder: indbygget vareliste + jeres egne varer (delt brugsfrekvens,
// rettelser og denne telefons historik). Forslag, aldrig automatisk rettelse.
// ============================================================
// Gør "ae/oe/aa" og "æ/ø/å" ens, så det virker på et tastatur uden æøå
function fold(t) { return t.toLowerCase().replace(/æ/g, "ae").replace(/ø/g, "oe").replace(/å/g, "aa").replace(/[éè]/g, "e").replace(/ü/g, "u"); }

// Damerau-Levenshtein (bytte af to nabobogstaver tæller som én fejl)
function editDist(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    const c = a[i-1] === b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + c);
    if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
  }
  return d[a.length][b.length];
}

let vocabCache = null, vocabKey = "";
function vocabulary() {
  const key = history_.length + "|" + Object.keys(meta.freq || {}).length + "|" + Object.keys(meta.overrides || {}).length;
  if (vocabCache && key === vocabKey) return vocabCache;
  const set = new Set([...PRODUCTS, ...history_, ...Object.keys(meta.freq || {}), ...Object.keys(meta.overrides || {})]);
  vocabCache = [...set].filter(Boolean).map(n => ({ n, f: fold(n), words: fold(n).split(/[^a-z0-9]+/).filter(Boolean) }));
  vocabKey = key;
  return vocabCache;
}

// Konsonant-skelet: "mlk" finder "mælk", som når man skriver hurtigt
function skeleton(t) { return t.replace(/[aeiouy]/g, ""); }

function suggestionsFor(query, max = 8) {
  const q = fold(query.trim());
  const onList = new Set(items.filter(i => !i.checked).map(i => normName(i.name)));
  const freq = meta.freq || {};
  const own = new Set(history_);
  const scored = [];
  for (const v of vocabulary()) {
    if (onList.has(v.n)) continue;
    let s = 0;
    if (!q) s = 1;                                        // tomt felt: kun ofte købte (filtreres nedenfor)
    else if (v.f === q) s = 95;
    else if (v.f.startsWith(q)) s = 100 - Math.min(v.f.length - q.length, 20) * 0.5;
    else if (v.words.some(w => w.startsWith(q))) s = 75;
    else if (q.length >= 3 && v.f.includes(q)) s = 55;
    else if (q.length >= 3 && skeleton(q) === q && v.words.some(w => skeleton(w).startsWith(q))) s = 45;
    else if (q.length >= 4) {
      // stavefejl: sammenlign med starten af ordet ("mozarela" ~ "mozzarella")
      const allowed = q.length <= 5 ? 1 : 2;
      let best = 99;
      for (const w of [v.f, ...v.words]) {
        for (const len of [q.length - 1, q.length, q.length + 1]) {
          if (len < 2 || len > w.length) continue;
          best = Math.min(best, editDist(q, w.slice(0, len)));
        }
      }
      if (best <= allowed) s = 40 - best * 10;
    }
    if (!s) continue;
    const base = s;
    const used = freq[v.n] || 0;
    if (!q && !used && !own.has(v.n)) continue;
    s += Math.min(used, 10) * 4 + (own.has(v.n) ? 6 : 0);
    scored.push([s, v.n, base]);
  }
  // Stavefejl-gæt vises kun, når der ikke er nok rigtige træf
  if (scored.filter(x => x[2] >= 55).length >= 3) scored.splice(0, scored.length, ...scored.filter(x => x[2] >= 55));
  scored.sort((a, b) => b[0] - a[0] || a[1].length - b[1].length || a[1].localeCompare(b[1], "da"));
  return scored.slice(0, max).map(x => x[1]);
}

function currentSegment() {
  const v = $("#newItem").value;
  const i = v.lastIndexOf(",");
  return { before: i >= 0 ? v.slice(0, i + 1) : "", seg: v.slice(i + 1).trim() };
}

function renderSuggest() {
  const box = $("#suggest");
  box.innerHTML = "";
  const input = $("#newItem");
  const { seg } = currentSegment();
  if (input.value.includes(":")) return; // man skriver en note, ikke en vare
  if (document.activeElement !== input && !seg) return;
  if (seg.length === 1) return; // ét bogstav giver for mange tilfældige forslag
  const list = suggestionsFor(seg);
  if (!list.length) return;
  if (!seg) { const l = document.createElement("span"); l.className = "lbl"; l.textContent = "Ofte købt:"; box.appendChild(l); }
  for (const name of list) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.textContent = name;
    const cat = document.createElement("small"); cat.textContent = categorize(name).split(" ")[0];
    b.appendChild(cat);
    b.setAttribute("aria-label", "Tilføj " + name);
    b.addEventListener("pointerdown", (e) => e.preventDefault()); // behold tastaturet åbent
    b.addEventListener("click", () => {
      addItems([name]);
      const { before } = currentSegment();
      // tidligere varer i feltet (før komma) bliver stående, kun det påbegyndte ord fjernes
      input.value = before.replace(/,\s*$/, "").trim() ? before.trimEnd() + " " : "";
      input.focus();
      renderSuggest();
    });
    box.appendChild(b);
  }
}

$("#newItem").addEventListener("input", renderSuggest);
$("#newItem").addEventListener("focus", renderSuggest);
$("#newItem").addEventListener("blur", () => setTimeout(() => { if (!currentSegment().seg) renderSuggest(); }, 150));

// Butiksvalg (pr. enhed)
$("#store").onchange = (e) => { activeId = e.target.value; ls.set("activeProfile", activeId); renderStores(); render(); };

// Indstillinger
function saveOrder(order) {
  const ap = activeProfile();
  const p = { name: ap.name || "Standard", order };
  if (!meta.profiles[ap.id]) p.created = Date.now();
  meta.profiles = { ...meta.profiles, [ap.id]: { ...(meta.profiles[ap.id] || {}), ...p } }; // vis med det samme
  run(backend.saveProfile(ap.id, p));
  renderOrder(); render();
}
function renderOrder() {
  const ul = $("#order"); ul.innerHTML = "";
  const order = currentOrder();
  order.forEach((c, idx) => {
    const li = document.createElement("li");
    const s = document.createElement("span"); s.textContent = c;
    const up = document.createElement("button"); up.textContent = "↑"; up.setAttribute("aria-label", "Flyt " + c + " op");
    const dn = document.createElement("button"); dn.textContent = "↓"; dn.setAttribute("aria-label", "Flyt " + c + " ned");
    up.onclick = () => { if (idx > 0) { [order[idx-1], order[idx]] = [order[idx], order[idx-1]]; saveOrder(order); } };
    dn.onclick = () => { if (idx < order.length-1) { [order[idx+1], order[idx]] = [order[idx], order[idx+1]]; saveOrder(order); } };
    li.append(s, up, dn); ul.appendChild(li);
  });
}
$("#newStore").onclick = () => {
  const name = (prompt("Navn på butik, fx Netto Vestergade") || "").trim();
  if (!name) return;
  const id = randomCode(8);
  const p = { name, order: currentOrder(), created: Date.now() }; // starter som kopi af den aktuelle rækkefølge
  meta.profiles = { ...meta.profiles, [id]: p };
  activeId = id; ls.set("activeProfile", id);
  run(backend.saveProfile(id, p));
  renderStores(); renderOrder(); render();
};
$("#renameStore").onclick = () => {
  const ap = activeProfile();
  const name = (prompt("Nyt navn", ap.name || "") || "").trim();
  if (!name) return;
  meta.profiles = { ...meta.profiles, [ap.id]: { ...(meta.profiles[ap.id] || { order: currentOrder(), created: Date.now() }), name } };
  run(backend.saveProfile(ap.id, meta.profiles[ap.id]));
  renderStores();
};
$("#deleteStore").onclick = () => {
  const ap = activeProfile();
  if (profileList().length <= 1) return;
  if (!confirm("Slet butikken \"" + (ap.name || "") + "\" for alle på listen?")) return;
  const { [ap.id]: _, ...rest } = meta.profiles; meta.profiles = rest;
  activeId = null; ls.set("activeProfile", null);
  run(backend.deleteProfile(ap.id));
  renderStores(); renderOrder(); render();
};

$("#settingsBtn").onclick = () => { $("#code").value = listCode; $("#myName").value = myName; renderStores(); renderOrder(); $("#settings").showModal();
  $("#settings h3").focus(); // undgå at tastaturet popper op på telefonen
};
$("#closeSettings").onclick = () => {
  const n = $("#myName").value.trim().slice(0, 20);
  if (n !== myName) { myName = n; ls.set("myName", n); render(); }
  const c = $("#code").value.trim();
  if (c && c !== listCode) {
    if (!validCode(c)) { alert("Listekoden skal være mindst " + MIN_CODE + " tegn og må ikke indeholde /."); return; }
    ls.set("listCode", c); location.hash = encodeURIComponent(c); // hashchange genindlæser siden
  }
  $("#settings").close();
};
// Slet med mulighed for at fortryde i 4 sekunder (i stedet for "Er du sikker?")
let undoTimer = null, undoItems = null;
function removeWithUndo(list, msg) {
  if (!list.length) return;
  undoItems = list.map(i => ({ ...i }));
  run(backend.removeMany(list.map(i => i.id)));
  $("#toastMsg").textContent = msg;
  $("#toast").classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { $("#toast").classList.remove("show"); undoItems = null; }, 4000);
}
$("#undoBtn").onclick = () => {
  if (undoItems) run(backend.restore(undoItems));
  undoItems = null; clearTimeout(undoTimer);
  $("#toast").classList.remove("show");
};
function clearAll() {
  removeWithUndo(items, "Listen er tømt (" + items.length + (items.length === 1 ? " vare)" : " varer)"));
  if ($("#settings").open) $("#settings").close();
}
$("#clearAll").onclick = clearAll;

// Ret vare og note (tryk på varenavnet)
let editing = null;
function openEdit(i) {
  editing = i;
  $("#editName").value = i.name;
  $("#editNote").value = i.note || "";
  $("#editItem").showModal();
  $("#editItem h3").focus();
}
$("#editCancel").onclick = () => { editing = null; $("#editItem").close(); };
$("#editSave").onclick = () => {
  if (!editing) return;
  const name = $("#editName").value.trim();
  const note = $("#editNote").value.trim().slice(0, 200);
  if (!name) { $("#editName").focus(); return; }
  const patch = {};
  if (name !== editing.name) { patch.name = name; patch.category = categorize(name); }
  if (note !== (editing.note || "")) patch.note = note;
  if (Object.keys(patch).length) run(backend.update(editing.id, patch));
  editing = null;
  $("#editItem").close();
};

// ============================================================
// 7) START
// ============================================================
backend.subscribe((data) => { items = data; render(); });
backend.subscribeMeta((data, fromCache) => {
  meta = { profiles: data.profiles || {}, overrides: data.overrides || {}, freq: data.freq || {} };
  // Første gang listen bruges: opret "Standard" ud fra lokale indstillinger fra den gamle version.
  // Fast id "standard", så to telefoner ikke laver hver sin. Kun når data er bekræftet af serveren.
  if (!fromCache && !metaLoaded) {
    metaLoaded = true;
    if (!Object.keys(meta.profiles).length) {
      const p = { name: "Standard", order: currentOrder(), created: Date.now() };
      meta.profiles = { standard: p };
      run(backend.saveProfile("standard", p));
    }
    const legacy = ls.get("overrides", {});
    if (Object.keys(legacy).length) {
      run(Promise.all(Object.entries(legacy)
        .filter(([n]) => !meta.overrides[n])
        .map(([n, c]) => backend.setOverride(n, c))));
      try { localStorage.removeItem("overrides"); } catch {}
    }
  }
  renderStores(); render();
  if ($("#settings").open) renderOrder();
});

// Service worker: gør at appen åbner uden net (fx i butikken)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW fejlede", e));
}
